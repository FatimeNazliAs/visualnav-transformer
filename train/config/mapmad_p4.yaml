# Phase 4 run A (Phase 4 confirmation items 1-3, 5-6): fine-tune from the official nomad.pth, 50/50 mix, spacing 5,
# 20 epochs of 200,000 samples, peak lr 1e-4; warmup over epoch 1 (per step, 1e-6 -> 1e-4), then cosine per epoch;
# checks every 2 epochs on the EMA weights. GPU0. Layered on mapmad_5050.yaml (-> mapmad.yaml).
base_config: mapmad_5050.yaml
project_name: p4_train
run_name: A
run_label: A
logs_root: /outputs/mapmad   # train.py writes /outputs/mapmad/p4_train/A_<time>/
gpu_ids: [0]
epochs: 20
seed: 0
init_weights: /outputs/mapmad/weights/official/nomad.pth   # sha256 70f79b82...a333; not a Phase 3 checkpoint

# lr: two AdamW groups (map_encoder.* / pretrained), set before every step (vint_train/mapmad/lr_schedule.py)
lr: 1e-4                  # map encoder (and run A's pretrained weights)
pretrained_lr: 1e-4
lr_schedule: warmup_cosine
warmup_start_ratio: 0.01  # 1e-4 x 0.01 = 1e-6 at step 0
scheduler: null           # no torch scheduler (NoMaD's GradualWarmupScheduler is not used)
warmup: False

checkpoints: ema_and_resume   # ema_0..ema_19.pth + one latest.pth (resume state)
step_log_freq: 100            # per-mode losses, distance loss, map attention share, lr per group -> metrics.jsonl

training_checks:
  every: 2                    # after epochs 2, 4, ..., 20 (files ema_1, ema_3, ..., ema_19)
  gostanford_subset: /outputs/mapmad/p4_train/subsets/gostanford_subset.json
  offline_subset: /outputs/mapmad/p4_train/subsets/offline_subset.json
  offline_list: /outputs/mapmad/p3_model/offline/offline_samples.json
  official_weights: /outputs/mapmad/weights/official/nomad.pth
  habitat_test: /mapmad_data/splits/habitat_mapmad/test/
  gostanford_test: /data/splits/go_stanford/test/
  batch_size: 100
  workers: 4
