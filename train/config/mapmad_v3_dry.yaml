# Phase 14b-3 DRY chain (never results): mapmad_v3.yaml on the DRY round-2 folders, 10 tiny epochs.
base_config: mapmad_v3.yaml
run_name: v3dry_s1
logs_root: /outputs/mapmad/p14b3_dry/chain
epoch_samples: 512
map:
