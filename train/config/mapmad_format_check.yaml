# MapMaD Phase 2 format check (gate G2 row 3): released nomad.yaml with the unchanged NoMaD loader reading
# habitat_mapmad's tiny split (make_p2_splits.py traj-names --tiny 4); 1 epoch, batch 8, no wandb. Map files ignored.
# Run from /outputs/mapmad/p2_datagen/format_check/run (see mapmad/README.md), so logs/ is written there.
project_name: mapmad_p2_format_check
run_name: format_check
wandb_entity: fnazlias
# training setup
use_wandb: False
train: True
batch_size: 8
epochs: 1
gpu_ids: [0]
num_workers: 0
lr: 1e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# mask 
goal_mask_prob: 0.5

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 3 # 5
alpha: 1e-4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: False

# dataset specific parameters
image_size: [96, 96] # width, height
datasets:
  habitat_mapmad:
    data_folder: /mapmad_data/habitat_mapmad
    train: /mapmad_data/splits/habitat_mapmad_tiny/train/
    test: /mapmad_data/splits/habitat_mapmad_tiny/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True

print_log_freq: 100 # in iterations
image_log_freq: 1000 #0 # in iterations
num_images_log: 8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs