# The simulated camera = LIMO's real camera (plan D9). Read by Phase 1 (robot model) and Phase 2 (drives).
# status: "measured" = read from the robot (2026-10-09, ROS2 camera_info / TF / tape), "spec" = data sheet,
# "chosen" = our setting. Mirrors /outputs/mapmad/p0_setup/facts.md; raw dump in p0_setup/robot/.
camera:
  model: Orbbec Dabai         # colour stream /camera/color/image_raw
  height_m: 0.18              # optical centre above the REAL floor (tape + TF base_link->camera_link 0.18 up)
  height_status: measured
  forward_of_base_m: 0.084    # camera ahead of the turning centre: AgileX LIMO URDF (the robot's TF says 0.18, a placeholder)
  forward_status: spec        # official (Naz, 2026-10-09); a later tape value replaces it only if it differs by > 3 cm
  width: 640
  height: 480
  resolution_status: measured # sim may render 320x240 (same FOV); NoMaD resizes to 96x96 anyway
  fx: 488.0918
  fy: 488.0918
  cx: 320.8124
  cy: 213.0621                # 27 px above the picture centre: why the centred sim camera needs a pitch
  distortion: ignored         # sim is an ideal pinhole (Naz, 2026-10-09)
  hfov_deg: 66.5              # 2 atan(320 / fx)
  hfov_status: measured
  vfov_deg: 52.4              # 2 atan(240 / fy), centred
  # Habitat camera: centred pinhole, this pitch (+ = up) puts its horizon on the real horizon row.
  # From mapmad/scripts/horizon_check.py (p0_setup/robot/horizon_check.json).
  sim_pitch_deg: -2.0
  sim_pitch_status: measured
  real_horizon_row: 222.7     # of 480, where floor lines meet in color_1..3.png (sim renders 223.7)
depth:
  width: 640
  height: 400
  fx: 475.698
  fy: 475.698
  cx: 322.821
  cy: 201.882
  hfov_deg: 67.8
  to_colour_m: 0.03           # sideways, no rotation
  units: mm                   # 16UC1
  status: measured
lidar:
  present: true
  model: YDLidar T-mini Pro
  topic: /scan                # needs sensor-data QoS (BEST_EFFORT)
  fov_deg: 220.0              # +-110 deg, not 360
  step_deg: 0.893             # 247 beams
  range_m: [0.03, 64.0]
  rate_hz: 10.0
  forward_of_base_m: 0.18     # laser_link, same height as base_link, no rotation
  status: measured
drive:
  type: differential          # motion_mode=0, use_mcnamu=False
  cmd_topic: /cmd_vel         # geometry_msgs/Twist
  odom_topic: /odom           # 50 Hz
  max_v_mps: 0.2              # the driver has no limits; NoMaD deployment/config/robot.yaml
  max_w_radps: 0.4
  speed_status: chosen
compute:                      # for running NoMaD on the robot
  jetpack: 5.1.2              # L4T 35.4.1
  cuda: "11.4"
  pytorch: "2.1"              # NVIDIA build, CUDA available
  python: 3.8.10
  ram_gb: 8
  disk_free_gb: 16
  status: measured
sim:                          # how Habitat moves and renders the virtual LIMO (Phase 1; reused by Phases 2 and 5)
  render_width: 320           # 4:3 like the Dabai; NoMaD resizes to 96x96
  render_height: 240
  control_hz: 4               # one command per 0.25 s, as NoMaD's robot.yaml frame_rate
  substeps: 10                # each 0.25 s command integrated exactly (arc) in 10 x 25 ms, every sub-step through the navmesh
  collision_tol_m: 0.01       # a command counts as a collision if its move is shortened by more than 1 cm
  camera_wall_margin_m: 0.02  # only matters if the camera sits ahead of the body radius: then moves that bring it closer to a wall are refused
  floor_probe_above_feet_m: 0.3   # a 4x4 depth camera this high above the navmesh point looks straight down
  floor_probe_hfov_deg: 10.0      # ... and finds the real floor under the turning centre (navmesh floats 0.05-0.18 m)
  floor_probe_max_m: 0.6      # readings farther than this (holes in the mesh) are ignored: last good height kept
navmesh:                      # floor map rebuilt per home at load with LIMO's size (Naz, 2026-10-09; Phases 1, 2, 5)
  # Size: AgileX LIMO Cobot spec sheet, 322 x 220 x 550 mm incl. the arm (Naz, 2026-10-09; replaces the 0.19 / 0.45
  # fallbacks). A later tape check changes the height only if it differs by > 5 cm.
  agent_radius_m: 0.195       # half the footprint diagonal: sqrt(0.322^2 + 0.220^2) / 2
  agent_height_m: 0.55        # robot incl. the parked arm
  agent_max_climb_m: 0.05     # LIMO cannot climb stairs or 20 cm steps
  cell_height_m: 0.05         # finer than HM3D's baked 0.2 m: the navmesh then lies closer to the real floor
  cell_size_m: 0.05           # as baked
  include_static_objects: false
  status: spec
