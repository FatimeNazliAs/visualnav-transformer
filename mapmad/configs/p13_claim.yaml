# Phase 13 — Goal 1: make the map claim airtight (kickoff 2026-10-28; rules frozen in
# /outputs/mapmad/p13_claim/p13_rules.md + .sha256, copy in configs/p13_rules.md). Read by both containers:
# mapmad/scripts/make_p13_sets.py, p13_videos.py (Habitat side) and vint_train.mapmad.closed_loop.run_search /
# p13_tables (NoMaD side). Paths below <outputs> unless "repo:" or absolute. Phase 12's P12_DEV_CHOICES.json
# (headline v21, tau 0.45) is copied into <out_dir> unchanged: tau 0.45 for every arm (kickoff §3 item 12).
out_dir: p13_claim
datagen: p8_datagen_v3a.yaml          # Phase 8 option A: map builder, target-layer noise, teacher, motion (configs/)
camera: camera_fair.yaml              # pin025 for every arm

sets:
  hm3d:                               # the Phase 12 main exam (300 episodes, 34 homes), reused (second use, p13_rules §6)
    folder: ../p12_search_exam/exam_set
    seed_salt: mapmad-p12             # = Phase 12's noise seeds: the Phase 12 arms' logs pair with the new arms
  video:                              # 13.1: the 12 Phase 12 video episodes are re-run from the same set
    folder: ../p12_search_exam/exam_set
    seed_salt: mapmad-p12
  examb:                              # 13.2: MP3D val (official episodes) + test (generated starts and view points)
    folder: examb_set
    id_prefix: p13b
    total: 300                        # aim 100 per bin (3-6 / 6-10 / 10-15 m), neighbour-bin fill
    per_home: 20                      # the smallest cap with >= 300 reachable (kept 345 -> 303; kickoff 13.2)
    draw_seed: 13201
    test_candidates: 60               # per test home (~ the val homes' 60 official episodes of our 6 categories)
    test_seed: 13202
    report_min_per_bin: 50            # kickoff §3: below this after the fill -> reported, still run
    seed_salt: mapmad-p13b
  dev:                                # 13.6: MP3D train homes, report only (no choice is made on it)
    folder: dev_set
    id_prefix: p13d
    total: 120
    per_home: 4
    candidates_per_home: 30
    candidate_seed: 13203
    draw_seed: 13204
    report_min_per_bin: 0
    seed_salt: mapmad-p13d

set_rules:                            # exam_set.SetRules (Phase 12 numbers; goal-photo fields unused)
  start_snap_max_m: 0.2
  view_point_max_snap_m: 0.2
  same_storey_dy_m: 0.5
  distance_m: [3.0, 15.0]
  bins_m: [3.0, 6.0, 10.0, 15.0]
  goal_photo_min_share: 0.05
  target_point_max_m: 1.0
  floor_names: [floor, carpet, rug, mat, doormat]
  goal_photo_box_m: null

mp3d_view_points:                     # mapmad_sim/mp3d_goals.py (test homes); radius from vp-calibrate (train homes)
  radius_m: 1.0
  grid_m: 0.1
  snap_m: 0.05
  below_m: 2.0
  min_pixels: 1
  calibrate_radii: [0.5, 0.75, 1.0, 1.25, 1.5]
  calibrate_homes: 6
  calibrate_seed: 13205

run:
  success_m: 0.2
  max_steps: 1000
  stop_at_success: false              # every run 1,000 steps; oracle and rule stop scored from the log
  stuck_steps: 100
  seeds: 3
  seed_salt: mapmad-p13               # default; each set names its own
  topdown_m_per_px: 0.05
  log_dets: true                      # kickoff §3 item 6: YOLOE boxes + scores of every frame (dets/<arm>/<run>.jsonl)
  rule_stop:
    ahead_m: 1.0
    half_angle_deg: 30.0
    min_views: 2
  house_seen:
    max_m: 3.0
    cell_m: 0.1
  revisit_cell_m: 0.5
  success_at: [500]

policy:                               # mapmad_v2 arms: Phase 5 MapMaD arm settings (Phases 11-12)
  num_samples: 8
  sample_index: 0
  waypoint_index: 1
  context_spacing: 5
  step_m: 0.25

policies:
  nomad: {num_samples: 8, sample_index: 0, waypoint_index: 2, context_spacing: 1}
  mapmad_v1: {num_samples: 8, sample_index: 0, waypoint_index: 1, context_spacing: 5, step_m: 0.25}
  frontier: {lookahead_m: 0.5, mark_radius_m: 1.0}

map_settings:
  builder: p2_datagen.yaml
  crop: repo:train/config/mapmad_p4_C.yaml

checkpoints:                          # sha256 checked before every run (arm_table.ArmTable.verify)
  v2:
    path: p10_v2_train/runs/v2_s1_2026_10_21_08_42_50/ema_19.pth
    sha256: 6d2492f19f7f1a5ccadea3f120b66a78b04bb5e88d10ca701fc523e0f9aee984
    config: repo:train/config/mapmad_v2.yaml
  v21:
    path: p11_dagger/runs/v21_s1_2026_10_23_06_11_59/ema_9.pth
    sha256: ebaabe28c490567cbd453ae426332864ca1ef22961bf1fabae59bb62bdb7c74f
    config: repo:train/config/mapmad_v21.yaml
  v21b: {from_file: V21B.json}        # below <out_dir>: written after the 13.4 fine-tune (ema_9)
  v1:
    path: p4_train/C_2026_10_11_05_21_43/ema_19.pth
    sha256: 8093c6dba5f91bce48903e74ad9128fde50cccbf9a8f587f9aec8b288bffd9e2
    config: repo:train/config/mapmad_p4_C.yaml
  official:
    path: weights/official/nomad.pth
    sha256: 70f79b8262527e20e56ced64a3e3d7ef91855bc9e7c3fa348d78edcb83c6a333
    config: weights/official/nomad.yaml
  headline: {from_choice: headline}   # P12_DEV_CHOICES.json (copied): v21

recognisers:
  yoloe: {model: yoloe, threshold: 0.01, p99: 0.7878322374820708, vlm: false}

arms:
  # --- Phase 12 arms (exactly Phase 12's wiring; 13.1 video re-runs, exam B) ---
  M2: {checkpoint: v2, maps: true, target: recogniser, recogniser: yoloe, pair: v2, label: "MapMaD v2"}
  M2h: {checkpoint: v2, maps: false, target: recogniser, recogniser: yoloe, pair: v2, seeds_not_headline: [0],
        label: "MapMaD v2, maps hidden"}
  M21: {checkpoint: v21, maps: true, target: recogniser, recogniser: yoloe, pair: v21, label: "MapMaD v2.1"}
  M21h: {checkpoint: v21, maps: false, target: recogniser, recogniser: yoloe, pair: v21, label: "MapMaD v2.1, maps hidden"}
  MT: {checkpoint: headline, maps: true, target: truth_noisy, label: "headline, sim-truth layer (upper limit)"}
  N: {policy: nomad, checkpoint: official, target: recogniser, recogniser: yoloe, label: "NoMaD explore"}
  V1: {policy: mapmad_v1, checkpoint: v1, map_zero: [heat], target: recogniser, recogniser: yoloe, label: "MapMaD v1, heat zero"}
  F: {policy: frontier, target: recogniser, recogniser: yoloe, label: "map + frontier"}
  # --- Phase 13 ---
  M21b: {checkpoint: v21b, maps: true, target: recogniser, recogniser: yoloe, label: "MapMaD v2.1b (both DAgger sets)"}
  M21bh: {checkpoint: v21b, maps: false, target: recogniser, recogniser: yoloe, label: "MapMaD v2.1b, maps hidden"}
  VF: {policy: vf, target: recogniser, recogniser: yoloe, label: "VLFM-style frontier choice (BLIP-2 value map)"}

videos:                               # 13.1: Phase 12's 12 video episodes (videos/video_list.json), seed index 0
  list: ../p12_search_exam/videos/video_list.json
  arms: [M2, M2h, M21, M21h, N, V1, F, MT]
  render_arms: [M21, M21h, N, F]     # rendered in the chain (13.1 budget <= 1 h; Phase 12's review set); the rest renders from the same logs later
