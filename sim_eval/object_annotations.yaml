# ==============================================================================
# sim_eval/object_annotations.yaml — where the goal words are, per house.
#
# The Gibson houses are static meshes: no object instances, no semantics. So a
# word goal needs the objects placed by hand, in world metres (the scene's own
# frame, the one `SimBody.pose` reports).
#
# How these were placed (Rs, 2026-09-28): a top-down height map of
# `mesh_z_up.obj` (max vertex height per 2 cm cell, 0.15-1.3 m) over the
# scene's traversability map, read against the house's `colorplan_000.jpg`
# for what each shape is. Then every `view_from` was rendered from the robot
# camera and looked at (`p7_1_annotations.py` writes those renders and an
# overview map) — an instance that does not show in its own photo is not an
# instance.
#
# Each instance:
#   category   one of the goal words (clip_goal_utils.GOAL_WORDS)
#   boxes      the footprint, as axis-aligned [xmin, xmax, ymin, ymax] boxes;
#              an L-shaped sofa is two. Distance to an instance is distance to
#              the nearest point of its footprint, not to a centre point that
#              sits inside the furniture.
#   view_from  [x, y]: where the goal photo is rendered from, ~1 m in front of
#              the object on its open side, facing the footprint's centre.
#
# Words with headline-tier counts (Phase 5 per-word breakdown) that Rs has:
# chair (n 309), sofa (245), table (32). Present but left out: counter (not a
# headline word), plant / screen / cabinet (too small or ambiguous from above).
# ==============================================================================

Rs:
  - id: sofa_0
    category: sofa
    note: L-shaped sofa, back to the bedroom wall, chaise along the south side
    boxes:
      - [-2.00, -1.05, -2.95, -0.80]
      - [-1.05, -0.05, -2.95, -2.05]
    view_from: [0.90, -2.00]

  - id: table_0
    category: table
    note: low coffee table on the rug, in front of the sofa
    boxes:
      - [-0.90, -0.30, -1.85, -0.60]
    view_from: [0.70, -1.20]

  - id: table_1
    category: table
    note: round dining table by the east wall
    boxes:
      - [1.10, 1.80, 0.15, 0.85]
    view_from: [0.05, 0.50]

  - id: chair_0
    category: chair
    note: bar chair at the breakfast counter, west
    boxes:
      - [-1.55, -1.05, 1.00, 1.40]
    view_from: [-1.30, 0.05]

  - id: chair_1
    category: chair
    note: bar chair at the breakfast counter, east
    boxes:
      - [-0.60, -0.20, 1.00, 1.35]
    view_from: [-0.40, 0.05]

  - id: chair_2
    category: chair
    note: dining chair, west side of the round table
    boxes:
      - [0.85, 1.15, 0.10, 0.60]
    view_from: [-0.10, 0.35]

  - id: chair_3
    category: chair
    note: dining chair, south side of the round table
    boxes:
      - [1.30, 1.80, -0.35, 0.00]
    view_from: [0.75, -0.95]

  - id: chair_4
    category: chair
    note: dining chair, north side of the round table (a bag on it)
    boxes:
      - [1.30, 1.75, 0.95, 1.30]
    view_from: [0.55, 1.15]
