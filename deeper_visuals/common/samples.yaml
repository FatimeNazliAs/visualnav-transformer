# deeper_visuals/common/samples.yaml
#
# The curated go_stanford scene library, lifted from the frozen
# debug_visuals/config.py SAMPLES table.
#
# Each scene is verified to sit inside the valid frame range and to show clear,
# interpretable motion. Grouped by the behaviour the future path shows.
#
# Valid frame range for a trajectory:
#     frame >= CONTEXT_SIZE (3)  and  frame <= total_frames - NUM_ACTIONS - 1
#
# To use a scene that is not in this table, a phase's config.yaml can inline it:
#     sample: {traj: no2vc_21_0, frame: 12}

# ── straight ahead ────────────────────────────────────────────────────────────
