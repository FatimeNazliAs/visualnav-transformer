<title>$title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
$styles
</style>

<main class="page">
  <header class="masthead">
    <p class="eyebrow">
      <span class="phase">$phase_label</span>
      <span class="sep">/</span>
      <span>$eyebrow</span>
    </p>
    <h1>$heading</h1>
    <p class="lead">$lead</p>
  </header>

$figures

  <ul class="stats">
$stats
  </ul>

  <p class="paper-note">$paper_note</p>

  <footer class="provenance">
$provenance
  </footer>
</main>
